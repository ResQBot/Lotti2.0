controller_manager:
  ros__parameters:
    update_rate: 50 #Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      
    lotti2_arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lotti2_flipper_controller:
      type: lotti2_flipper_controller/FlipperController

    lotti2_drive_controller:
      type: diff_drive_controller/DiffDriveController



lotti2_flipper_controller:
  ros__parameters:
    joints:
    - flipper_fr_joint
    - flipper_fl_joint
    - flipper_rr_joint
    - flipper_rl_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - effort
    - velocity
    - temp

    update_rate: 50



lotti2_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_chain_joint"]
    right_wheel_names: ["right_chain_joint"]

    wheel_separation: 0.30
    wheel_radius: 0.25

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: body_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: true
    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.max_velocity: 12.0      # set to 1.0 so speed is a % of max speed
    linear.x.max_acceleration: 6.0  
    linear.x.max_jerk: NAN

    angular.z.max_velocity: 12.0
    angular.z.max_acceleration: 6.0
    angular.z.max_jerk: NAN



lotti2_arm_group_controller:
  ros__parameters:
    joints:
    - arm1_joint
    - arm2_joint
    - arm3_joint
    - arm4_joint
    - arm5_joint
    - arm6_joint
    - arm7_joint
    command_interfaces:
    - position
    state_interfaces:
    - position

    allow_partial_joints_goal: true
    open_loop_control: true
    interpolate_from_desired_state: true
    set_last_command_interface_value_as_state_on_activation: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.1

    update_rate: 25